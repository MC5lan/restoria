<?xml version="1.0" encoding="UTF-8"?>
<!--
  档案数字化集成工具 — 图标设计源（向量版）
  设计：深蓝渐变圆角方底 + 白色文档（折角）+ 文本行 + 一道扫描光带。
  小尺寸（16/24/32px）在 tools\IconGen.cs 里会换成简化的两行版本，保证清晰。
  生成 .ico：见 tools\make_icon.bat
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#123C8F"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FE3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8FE3FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#8FE3FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pageClip">
      <path d="M74 40 h78 l34 34 v142 a6 6 0 0 1 -6 6 H74 a6 6 0 0 1 -6 -6 V46 a6 6 0 0 1 6 -6 z"/>
    </clipPath>
  </defs>

  <!-- 底：圆角方形 -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#0C2A66" stroke-width="3" stroke-opacity="0.55"/>

  <!-- 文档投影 -->
  <path d="M74 44 h78 l34 34 v142 a6 6 0 0 1 -6 6 H74 a6 6 0 0 1 -6 -6 V50 a6 6 0 0 1 6 -6 z"
        fill="#0B2A63" fill-opacity="0.35" transform="translate(4,6)"/>

  <!-- 文档主体 -->
  <path d="M74 40 h78 l34 34 v142 a6 6 0 0 1 -6 6 H74 a6 6 0 0 1 -6 -6 V46 a6 6 0 0 1 6 -6 z"
        fill="#F7FAFF"/>
  <!-- 折角 -->
  <path d="M152 40 l34 34 h-28 a6 6 0 0 1 -6 -6 z" fill="#C7D9F7"/>
  <path d="M152 40 l34 34" fill="none" stroke="#9FB9E6" stroke-width="2"/>

  <!-- 文本行 -->
  <g fill="#5C7BB5">
    <rect x="86" y="104" width="94" height="10" rx="5"/>
    <rect x="86" y="128" width="94" height="10" rx="5"/>
    <rect x="86" y="152" width="62" height="10" rx="5"/>
  </g>

  <!-- 扫描光带 -->
  <g clip-path="url(#pageClip)">
    <rect x="62" y="176" width="130" height="14" fill="url(#scan)" opacity="0.9"/>
    <rect x="62" y="180" width="130" height="3" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- 右下角数字化小方块（像素点） -->
  <g fill="#8FE3FF">
    <rect x="176" y="186" width="12" height="12" rx="3"/>
    <rect x="192" y="202" width="12" height="12" rx="3" opacity="0.75"/>
    <rect x="176" y="218" width="12" height="12" rx="3" opacity="0.5"/>
  </g>
</svg>
