name: build and gate

# A gate that only the author can run is decoration. Three steps here fail the
# job outright: --selftest, --layout-check and the resource scanner. The full
# gate runs for its report but is allowed to fail, because the performance
# baseline recorded on the author's machine says nothing about a GitHub runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    # Windows + .NET Framework 4.8（项目目标是 Win7 SP1~Win11，AnyCPU 构建）
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          set PICTOOL_NO_PAUSE=1
          build.bat

      - name: Algorithm self-test (--selftest)
        shell: cmd
        run: |
          dist\PicTool.exe --selftest
          if errorlevel 1 (exit /b 1)

      - name: Layout snapshot must match the baseline
        shell: pwsh
        run: |
          # --layout-check, not --layout. --layout only exports the snapshot and
          # always exits 0, so an errorlevel test below it never fired and this
          # step was a green shell that checked nothing. --layout-check compares
          # against tools\golden-layout.txt and exits 1 on any difference.
          #
          # The difference detail is read from a UTF-8 file the program writes,
          # not from its stderr. On this runner the console code page cannot
          # encode the Chinese report text, so anything read back from the
          # console arrives as question marks -- an earlier version filtered
          # stderr with a regex and silently matched nothing, which meant the
          # gate failed with no readable reason at all.
          #
          # Annotations are used because step logs need authentication to
          # download while annotations are readable through the public API. A
          # gate whose reason for failing cannot be read is only marginally
          # better than one that never fails.

          $out = & dist\PicTool.exe --layout-check 2>&1 | ForEach-Object { "$_" }
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }

          if ($rc -ne 0) {
            Write-Host ""
            # Emit everything needed to explain the failure as annotations,
            # because step logs need authentication to download while
            # annotations are readable through the public API.
            #
            # Two rounds were spent guessing why this gate failed. The first
            # guess (missing font) was wrong: the diagnostic proved the runner
            # has Microsoft YaHei UI, the same face this machine uses. So this
            # version reports the raw evidence instead of interpreted evidence.

            # 1. Which temp files exist at all?
            Write-Host "=== temp files ==="
            $tmp = $env:TEMP
            Write-Host ("TEMP = " + $tmp)
            Get-ChildItem $tmp -Filter 'PicTool-*' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("::error::temp file: " + $_.Name + "  " + $_.Length + " B") }

            foreach ($f in @('PicTool-layout-diag.txt', 'PicTool-layout-diff.txt')) {
              $p = Join-Path $tmp $f
              Write-Host ""
              Write-Host ("--- " + $f + " ---")
              if (-not (Test-Path $p)) {
                Write-Host ("::error::MISSING: " + $p)
                continue
              }
              $content = Get-Content $p -Encoding UTF8
              Write-Host ("(" + $content.Count + " lines)")
              $n = 0
              foreach ($line in $content) {
                if ($n -ge 45) { Write-Host ("::error::... truncated, " + $content.Count + " lines total"); break }
                Write-Host $line
                if ($line.Trim().Length -gt 0) { Write-Host ("::error::" + $line) }
                $n++
              }
            }
            exit 1
          }

      - name: Resource gate (LockBits pairing)
        # if: always() so one failing gate does not hide the others. A run that
        # reports everything at once is worth more than one that reveals one
        # problem per push, especially when the first failure turns out to be
        # environmental.
        if: always()
        shell: cmd
        run: |
          rem Unbalanced LockBits/UnlockBits is the one class of bug that
          rem corrupts a bitmap in place and can still pass every functional
          rem test, so it gets its own gating step.
          python tools\check_resources.py --strict
          if errorlevel 1 (exit /b 1)

      - name: Full gate (self-test + layout + AI artifact + performance)
        # See the note on the resource gate: report everything in one run.
        if: always()
        shell: cmd
        run: |
          rem The four gates all execute here. The run is allowed to fail the
          rem job on a real regression, but a performance verdict on a runner
          rem is reported as inconclusive rather than failed: the baseline was
          rem recorded on the author's machine and says nothing about the CPU
          rem GitHub hands out. --selftest, --layout and the resource gate are
          rem the steps that block a bad commit.
          set PICTOOL_NO_PAUSE=1
          python tools\gate.py
        continue-on-error: true

      - name: Collect gate reports
        if: always()
        shell: cmd
        run: |
          rem Copy whatever reports exist, one at a time. A report is absent
          rem whenever its mode did not run (no AI runtime on the runner means
          rem no ai-fill report), and `copy` of a missing file sets a non-zero
          rem exit code, which would fail the whole job over a missing log.
          rem An earlier version did `if not exist ... exit /b 0`, which also
          rem skipped the remaining copies, and then let the last failed copy
          rem decide the step result.
          mkdir reports 2>nul
          for %%f in (selftest layout ai-fill bench) do (
            if exist "%TEMP%\PicTool-%%f.txt" (
              copy /y "%TEMP%\PicTool-%%f.txt" "reports\%%f.txt" >nul
              echo     collected %%f.txt
            ) else (
              echo     no %%f.txt on this runner
            )
          )
          exit /b 0

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: reports/
          if-no-files-found: ignore